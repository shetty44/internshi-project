version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: student-dashboard-mongodb
    environment:
      MONGO_INITDB_DATABASE: student-dashboard
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - student-dashboard

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student-dashboard-backend
    ports:
      - "5500:5500"
    environment:
      MONGO_URI: mongodb://mongodb:27017/student-dashboard
      JWT_SECRET: development_secret_key
      PORT: 5500
      NODE_ENV: development
    depends_on:
      - mongodb
    networks:
      - student-dashboard
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: student-dashboard-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5500/api
    depends_on:
      - backend
    networks:
      - student-dashboard
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongodb_data:

networks:
  student-dashboard:
    driver: bridge
